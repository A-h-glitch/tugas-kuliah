<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        form div {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .radio-group {
            display: flex;
            gap: 20px;
        }
        input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: 500;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        .display-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: none;
        }
        .display-box.show {
            display: block;
        }
        .display-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .display-box p {
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        .display-box strong {
            color: #667eea;
        }
        .display-box hr {
            margin: 15px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
        .foto-preview {
            margin-top: 15px;
            max-width: 200px;
        }
        .foto-preview img {
            width: 100%;
            border-radius: 5px;
            border: 2px solid #ddd;
        }        .display-box button {
            margin-top: 20px;
            background: #28a745;
        }
        .display-box button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulir Pendaftaran</h1>
        
        <div class="form-box">
            <form id="daftarForm">
                <div>
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                </div>
                <div>
                    <label>Jenis Kelamin:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="jenisKelamin" value="Laki-laki" required> Laki-laki</label>
                        <label><input type="radio" name="jenisKelamin" value="Perempuan"> Perempuan</label>
                    </div>
                </div>
                <div>
                    <label for="hobi">Hobi:</label>
                    <input type="text" id="hobi" name="hobi" placeholder="Masukkan hobi Anda" required>
                </div>
                <div>
                    <label for="kota">Pilih Kota:</label>
                    <select name="kota" id="kota" required>
                        <option value="">-- Pilih Kota --</option>
                        <option value="Karawang">Karawang</option>
                        <option value="Bandung">Bandung</option>
                        <option value="Jakarta">Jakarta</option>
                    </select>
                </div>
                <div>
                    <label for="foto">Upload Foto:</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>

                <button type="submit">Daftar</button>
            </form>
        </div>

        <div class="display-box" id="displayBox">
            <h2>Data Pendaftaran Anda</h2>
            <p><strong>Nama:</strong> <span id="displayNama"></span></p>
            <p><strong>Email:</strong> <span id="displayEmail"></span></p>
            <p><strong>Jenis Kelamin:</strong> <span id="displayJenisKelamin"></span></p>
            <p><strong>Hobi:</strong> <span id="displayHobi"></span></p>
            <p><strong>Kota:</strong> <span id="displayKota"></span></p>
            <div id="fotoContainer"></div>
            <hr>
            <button id="kirimBtn" type="button">Kirim</button>
        </div>
    </div>

    <script>
        document.getElementById('daftarForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const jenisKelamin = document.querySelector('input[name="jenisKelamin"]:checked').value;
            const hobi = document.getElementById('hobi').value;
            const kota = document.getElementById('kota').value;
            const fotoInput = document.getElementById('foto');

            document.getElementById('displayNama').textContent = nama;
            document.getElementById('displayEmail').textContent = email;
            document.getElementById('displayJenisKelamin').textContent = jenisKelamin;
            document.getElementById('displayHobi').textContent = hobi;
            document.getElementById('displayKota').textContent = kota;

            const fotoContainer = document.getElementById('fotoContainer');
            fotoContainer.innerHTML = '';

            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    const div = document.createElement('div');
                    div.className = 'foto-preview';
                    div.innerHTML = '<p><strong>Foto Anda:</strong></p>';
                    div.appendChild(img);
                    fotoContainer.appendChild(div);
                };
                reader.readAsDataURL(fotoInput.files[0]);
            }

            document.getElementById('displayBox').classList.add('show');
            window.scrollTo({ top: document.getElementById('displayBox').offsetTop - 100, behavior: 'smooth' });
        });

        document.getElementById('kirimBtn').addEventListener('click', function() {
            alert('Data telah dikirim. Terima kasih!');
        });
    </script>
</body>
</html>
